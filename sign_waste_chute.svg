<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="#fff"/><rect x="0" y="0" width="210" height="58" fill="#CE1126"/><rect x="0" y="58" width="210" height="2.5" fill="#0E211F"/><text x="12" y="30" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="start" >WASTE CHUTE</text><text x="12" y="50.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="4.4" font-weight="normal" fill="#FFFFFFCC" text-anchor="start" >General waste only  ·  Bagged and tied  ·  One bag at a time</text><g transform="translate(158 8) scale(1.1)"><path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M10 6h20v8H10zM14 14v20h12V14"/><path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 26h12"/></g><g transform="translate(12 68) scale(0.275)"><circle cx="20" cy="20" r="18" fill="#1E9E4A"/><path d="M11 21l6 6 12-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="27" y="76.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="7.5" font-weight="bold" fill="#1E9E4A" text-anchor="start" >How to use the chute</text><circle cx="27" cy="99" r="13" fill="#F1F3F3"/><g transform="translate(17 89) scale(0.5)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 12c-8 0-12 8-12 14a12 8 0 0 0 24 0c0-6-4-14-12-14z"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M16 12c0-4 2-6 4-6s4 2 4 6M14 8l3 4M26 8l-3 4"/></g><text x="46" y="97" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.6" font-weight="bold" fill="#0E211F" text-anchor="start" >Bag it and tie it</text><text x="46" y="104" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="normal" fill="#5A6664" text-anchor="start" >Tie the bag tightly. Loose waste blocks the chute.</text><circle cx="27" cy="129" r="13" fill="#F1F3F3"/><g transform="translate(17 119) scale(0.5)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M8 20h24l-2 14H10z"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 20l4-8h20l4 8"/></g><text x="46" y="127" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.6" font-weight="bold" fill="#0E211F" text-anchor="start" >Small bags only</text><text x="46" y="134" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="normal" fill="#5A6664" text-anchor="start" >The bag must fit through the hopper door without forcing.</text><circle cx="27" cy="159" r="13" fill="#F1F3F3"/><g transform="translate(17 149) scale(0.5)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M10 6h20v8H10zM14 14v20h12V14"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 26h12"/></g><text x="46" y="157" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.6" font-weight="bold" fill="#0E211F" text-anchor="start" >Drop, don't push</text><text x="46" y="164" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="normal" fill="#5A6664" text-anchor="start" >Open the hopper, drop the bag in, let the door close.</text><rect x="0" y="180" width="210" height="68" fill="#FBEBEC"/><g transform="translate(12 187) scale(0.275)"><circle cx="20" cy="20" r="18" fill="#CE1126"/><path d="M13 13l14 14M27 13L13 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="27" y="195.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="7.5" font-weight="bold" fill="#CE1126" text-anchor="start" >NEVER put these down the chute</text><circle cx="27.5" cy="214" r="11" fill="#fff"/><g transform="translate(19.5 206) scale(0.4)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M17 4h6v7l4 5v17a2 2 0 0 1-2 2H15a2 2 0 0 1-2-2V16l4-5z"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M17 7h6"/></g><text x="27.5" y="231.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >Glass &amp;</text><text x="27.5" y="235.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >recycling</text><circle cx="58.5" cy="214" r="11" fill="#fff"/><g transform="translate(50.5 206) scale(0.4)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 12h28v16H6z"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 20h28M20 12v16M13 12l-7 8M27 12l7 8"/></g><text x="58.5" y="231.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >Boxes &amp;</text><text x="58.5" y="235.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >cardboard</text><circle cx="89.5" cy="214" r="11" fill="#fff"/><g transform="translate(81.5 206) scale(0.4)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 5c3 7 10 10 10 18a10 10 0 0 1-20 0c0-4 2-6 3-9 2 3 3 4 5 2 0-4 1-7 2-11z"/></g><text x="89.5" y="231.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >Hot ashes &amp;</text><text x="89.5" y="235.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >cigarettes</text><circle cx="120.5" cy="214" r="11" fill="#fff"/><g transform="translate(112.5 206) scale(0.4)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 5c6 10 9 14 9 19a9 9 0 0 1-18 0c0-5 3-9 9-19z"/></g><text x="120.5" y="231.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >Liquids &amp;</text><text x="120.5" y="235.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >paint</text><circle cx="151.5" cy="214" r="11" fill="#fff"/><g transform="translate(143.5 206) scale(0.4)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 28l22-20 6 6-22 20z"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 30l-2-2M18 24l-2-2M24 18l-2-2"/></g><text x="151.5" y="231.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >Long or heavy</text><text x="151.5" y="235.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >items</text><circle cx="182.5" cy="214" r="11" fill="#fff"/><g transform="translate(174.5 206) scale(0.4)"><rect x="14" y="8" width="12" height="26" rx="2" fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M17 5h6v3h-6zM20 14l-3 6h6l-3 6"/></g><text x="182.5" y="231.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >Batteries &amp;</text><text x="182.5" y="235.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="bold" fill="#7A1420" text-anchor="middle" >e-waste</text><rect x="12" y="254" width="186" height="17" rx="2" fill="#F1F3F3"/><rect x="12" y="254" width="3" height="17" fill="#FFC20E"/><text x="20" y="261.2" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.7" font-weight="bold" fill="#0E211F" text-anchor="start" >Recycling, glass and organics go to the bin room on level:</text><path d="M132 262h20" stroke="#5A6664" stroke-width="0.4"/><text x="20" y="266.7" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.2" font-weight="normal" fill="#5A6664" text-anchor="start" >A blocked chute affects every resident above you. Report blockages to building management immediately.</text><rect x="0" y="277" width="210" height="20" fill="#0E211F"/><g transform="translate(10 281.5) scale(0.171875)"><rect width="64" height="64" rx="14" fill="#0D151B" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5"/><path d="M 12 57 A 38 38 0 0 0 57 12" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="31" y="44" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="34" font-weight="800" text-anchor="middle"><tspan fill="#F0F8FA">W</tspan><tspan dx="-2" fill="#2DD4BF">P</tspan></text></g><text x="24.3" y="287.55" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.82" font-weight="bold" fill="#fff" text-anchor="start" >WastePlanner</text><text x="24.3" y="291.62" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.52" font-weight="normal" fill="#BFD6D0" text-anchor="start" >by Pro Waste Consultants</text><text x="200" y="285.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.4" font-weight="bold" fill="#fff" text-anchor="end" >Free signage pack: wasteplanner.au/signage</text><text x="200" y="291.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.0" font-weight="normal" fill="#BFD6D0" text-anchor="end" >Edit the level number before printing</text></svg>