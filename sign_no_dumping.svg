<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="#fff"/><rect x="0" y="0" width="210" height="58" fill="#CE1126"/><rect x="0" y="58" width="210" height="2.5" fill="#0E211F"/><text x="12" y="30" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="start" >NO DUMPING</text><text x="12" y="50.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="4.4" font-weight="normal" fill="#FFFFFFCC" text-anchor="start" >Do not leave anything on the floor or beside the bins</text><g transform="translate(170 12) scale(0.75)"><circle cx="20" cy="20" r="18" fill="#CE1126"/><path d="M13 13l14 14M27 13L13 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="12" y="78" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="7" font-weight="bold" fill="#0E211F" text-anchor="start" >Items left here are not collected.</text><text x="12" y="87" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="4.2" font-weight="normal" fill="#5A6664" text-anchor="start" >They block access for cleaners and collection crews, create a fire and pest risk, and</text><text x="12" y="93" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="4.2" font-weight="normal" fill="#5A6664" text-anchor="start" >the cost of removal is passed on to all owners and residents.</text><rect x="12" y="104" width="186" height="78" rx="2" fill="#F1F3F3"/><text x="20" y="116" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#0E211F" text-anchor="start" >Bulky items must be booked</text><circle cx="40" cy="136" r="12" fill="#fff"/><g transform="translate(31 127) scale(0.45)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 20v10h28V20"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M10 20v-8h20v8M6 20h28M10 30v3M30 30v3"/></g><text x="40" y="154.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >Furniture &amp;</text><text x="40" y="158.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >mattresses</text><circle cx="86" cy="136" r="12" fill="#fff"/><g transform="translate(77 127) scale(0.45)"><rect x="12" y="5" width="16" height="30" rx="2" fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 16h16M24 9v4M24 20v6"/></g><text x="86" y="154.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >Whitegoods</text><text x="86" y="158.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >&amp; appliances</text><circle cx="132" cy="136" r="12" fill="#fff"/><g transform="translate(123 127) scale(0.45)"><rect x="13" y="5" width="14" height="30" rx="3" fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M17 30h6M13 10h14M13 26h14"/></g><text x="132" y="154.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >E-waste &amp;</text><text x="132" y="158.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >TVs</text><circle cx="178" cy="136" r="12" fill="#fff"/><g transform="translate(169 127) scale(0.45)"><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 28l22-20 6 6-22 20z"/><path fill="none" stroke="#0E211F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 30l-2-2M18 24l-2-2M24 18l-2-2"/></g><text x="178" y="154.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >Timber &amp;</text><text x="178" y="158.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="middle" >building waste</text><text x="20" y="170" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.6" font-weight="normal" fill="#5A6664" text-anchor="start" >Book a hard waste collection with Council or building management, or take items to the nearest</text><text x="20" y="175.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.6" font-weight="normal" fill="#5A6664" text-anchor="start" >transfer station. Charity stores accept many items in good condition.</text><rect x="12" y="192" width="186" height="22" rx="2" fill="#FBEBEC"/><rect x="12" y="192" width="3" height="22" fill="#CE1126"/><text x="20" y="201" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5" font-weight="bold" fill="#7A1420" text-anchor="start" >Dumping is an offence</text><text x="20" y="208.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.4" font-weight="normal" fill="#7A1420" text-anchor="start" >Illegal dumping can attract on-the-spot fines under Council local laws and the Environment Protection Act 2017 (Vic).</text><text x="12" y="226" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="4.4" font-weight="bold" fill="#0E211F" text-anchor="start" >To book a collection or report dumping:</text><text x="12" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="start" >Building manager:</text><path d="M47 236.5h70" stroke="#5A6664" stroke-width="0.4"/><text x="12" y="246" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="start" >Council hard waste:</text><path d="M50 246.5h67" stroke="#5A6664" stroke-width="0.4"/><text x="12" y="256" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="start" >Transfer station:</text><path d="M45 256.5h72" stroke="#5A6664" stroke-width="0.4"/><g transform="translate(140 220) scale(1.25)"><path d="M8 14h24l-3 22H11z" fill="#fff" stroke="#0E211F" stroke-width="2.2" stroke-linejoin="round"/><path d="M5 14l4-8h22l4 8z" fill="#CE1126" stroke="#0E211F" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 20v12M20 20v12M26 20v12" stroke="#0E211F" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="37" r="2.2" fill="#0E211F"/><circle cx="28" cy="37" r="2.2" fill="#0E211F"/></g><rect x="0" y="277" width="210" height="20" fill="#0E211F"/><g transform="translate(10 281.5) scale(0.171875)"><rect width="64" height="64" rx="14" fill="#0D151B" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5"/><path d="M 12 57 A 38 38 0 0 0 57 12" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="31" y="44" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="34" font-weight="800" text-anchor="middle"><tspan fill="#F0F8FA">W</tspan><tspan dx="-2" fill="#2DD4BF">P</tspan></text></g><text x="24.3" y="287.55" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.82" font-weight="bold" fill="#fff" text-anchor="start" >WastePlanner</text><text x="24.3" y="291.62" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.52" font-weight="normal" fill="#BFD6D0" text-anchor="start" >by Pro Waste Consultants</text><text x="200" y="285.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.4" font-weight="bold" fill="#fff" text-anchor="end" >Free signage pack: wasteplanner.au/signage</text><text x="200" y="291.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.0" font-weight="normal" fill="#BFD6D0" text-anchor="end" >Edit the contact block before printing</text></svg>