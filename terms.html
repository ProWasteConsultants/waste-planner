<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms of Service — WastePlanner</title>
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://wasteplanner.au/terms">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- No legal text lives here: legal/page.js renders legal/terms.md, with the
     version and effective date from legal/versions.json. -->
<style>
  :root { --teal:#0E7C7B; --ink:#0A3D38; --body:#374151; --muted:#6B7280; --line:#E3ECEB; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Helvetica Neue', Arial, sans-serif; color:var(--body); background:#F7FAFA; line-height:1.65; font-size:14px; }
  .page { max-width:760px; margin:0 auto; padding:40px 16px 80px; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  header img { width:28px; height:28px; }
  header a { font-weight:700; color:var(--ink); text-decoration:none; font-size:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:36px 40px; overflow-wrap:anywhere; }
  #doc h1 { font-size:22px; color:var(--ink); margin-bottom:4px; line-height:1.3; }
  .updated { color:var(--muted); font-size:12px; margin-bottom:24px; }
  #doc h2 { font-size:15px; color:var(--ink); margin:24px 0 6px; }
  #doc h3 { font-size:14px; color:var(--ink); margin:18px 0 4px; }
  #doc h4, #doc h5, #doc h6 { font-size:13.5px; color:var(--ink); margin:14px 0 4px; }
  #doc p { margin-bottom:10px; }
  #doc ul, #doc ol { margin:0 0 10px; padding-left:22px; }
  #doc li { margin-bottom:4px; }
  #doc li > ul, #doc li > ol { margin:4px 0 0; }
  #doc a { color:var(--teal); }
  #doc blockquote { border-left:3px solid var(--line); padding:2px 0 2px 14px; color:var(--muted); margin:0 0 10px; }
  #doc hr { border:0; border-top:1px solid var(--line); margin:20px 0; }
  #doc code { background:#F1F5F5; border-radius:4px; padding:1px 5px; font-size:12.5px; }
  #doc .table-wrap { overflow-x:auto; margin:0 0 12px; }
  #doc table { border-collapse:collapse; width:100%; font-size:13px; }
  #doc th, #doc td { border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; }
  #doc th { background:#F1F7F7; color:var(--ink); }
  .loading, .err { color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:28px; }
  footer a { color:var(--teal); }
  @media (max-width:600px) { .card { padding:24px 18px; } }
  @media print { body { background:#fff; } header, footer { display:none; } .card { border:0; padding:0; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <img src="favicon.svg" alt=""><a href="./">WastePlanner</a>
  </header>
  <main class="card">
    <article id="doc" data-doc="terms"><p class="loading">Loading the Terms of Service…</p></article>
    <noscript><p>Read the <a href="legal/terms.md">Terms of Service (text version)</a>.</p></noscript>
  </main>
  <footer><a href="./">WastePlanner</a> · <a href="privacy">Privacy Policy</a> · <a href="mailto:info@prowaste.au">info@prowaste.au</a></footer>
</div>
<script src="legal/md.js"></script>
<script src="legal/page.js"></script>
</body>
</html>
