<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="#fff"/><rect x="0" y="0" width="210" height="46" fill="#0E211F"/><text x="12" y="24" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="start" >BIN ROOM RULES</text><text x="12" y="37" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="4.6" font-weight="normal" fill="#BFD6D0" text-anchor="start" >Please help keep this room clean, safe and working for everyone</text><circle cx="19" cy="64" r="6.5" fill="#0E211F"/><text x="19" y="66.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >1</text><text x="30" y="63" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >Use the correct bin</text><text x="30" y="69.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >Check the coloured sign above each bin. If you're not sure, use general waste rather than contaminate</text><text x="30" y="74.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >recycling.</text><circle cx="19" cy="86.5" r="6.5" fill="#0E211F"/><text x="19" y="88.8" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >2</text><text x="30" y="85.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >Keep lids closed</text><text x="30" y="92.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >Open lids attract pests, cause odour and let rain in. Only fill to the lid — don't overfill.</text><circle cx="19" cy="109.0" r="6.5" fill="#0E211F"/><text x="19" y="111.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >3</text><text x="30" y="108.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >Bag general waste, loose recycling</text><text x="30" y="114.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >General waste must be bagged and tied. Recycling, glass and organics go in loose.</text><circle cx="19" cy="131.5" r="6.5" fill="#0E211F"/><text x="19" y="133.8" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >4</text><text x="30" y="130.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >Flatten all cardboard</text><text x="30" y="137.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >Whole boxes fill a bin in minutes. Break them down before they go in.</text><circle cx="19" cy="154.0" r="6.5" fill="#0E211F"/><text x="19" y="156.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >5</text><text x="30" y="153.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >Nothing on the floor</text><text x="30" y="159.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >Items left beside bins are not collected. Dumping may incur a fine under Council local laws.</text><circle cx="19" cy="176.5" r="6.5" fill="#0E211F"/><text x="19" y="178.8" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >6</text><text x="30" y="175.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >Bulky items are booked, not dumped</text><text x="30" y="182.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >Furniture, mattresses and whitegoods must be booked for hard waste collection or taken to a transfer</text><text x="30" y="186.8" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >station.</text><circle cx="19" cy="199.0" r="6.5" fill="#0E211F"/><text x="19" y="201.3" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >7</text><text x="30" y="198.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >E-waste and batteries go to the drop-off point</text><text x="30" y="204.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >Never in any bin. Batteries in bins cause truck and facility fires.</text><circle cx="19" cy="221.5" r="6.5" fill="#0E211F"/><text x="19" y="223.8" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#fff" text-anchor="middle" >8</text><text x="30" y="220.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="5.2" font-weight="bold" fill="#0E211F" text-anchor="start" >Report problems</text><text x="30" y="227.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >Full, damaged or missing bins, spills and blocked chutes — contact building management using the details</text><text x="30" y="231.8" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.5" font-weight="normal" fill="#5A6664" text-anchor="start" >below.</text><rect x="12" y="246" width="186" height="26" rx="2" fill="#F1F3F3"/><rect x="12" y="246" width="3" height="26" fill="#2DD4BF"/><text x="20" y="254" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="start" >Building manager:</text><path d="M55 254.5h60" stroke="#5A6664" stroke-width="0.4"/><text x="122" y="254" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="start" >Phone:</text><path d="M137 254.5h56" stroke="#5A6664" stroke-width="0.4"/><text x="20" y="264" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="start" >Waste contractor:</text><path d="M55 264.5h60" stroke="#5A6664" stroke-width="0.4"/><text x="122" y="264" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.8" font-weight="bold" fill="#0E211F" text-anchor="start" >Collection days:</text><path d="M152 264.5h41" stroke="#5A6664" stroke-width="0.4"/><rect x="0" y="277" width="210" height="20" fill="#0E211F"/><g transform="translate(10 281.5) scale(0.171875)"><rect width="64" height="64" rx="14" fill="#0D151B" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5"/><path d="M 12 57 A 38 38 0 0 0 57 12" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="31" y="44" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="34" font-weight="800" text-anchor="middle"><tspan fill="#F0F8FA">W</tspan><tspan dx="-2" fill="#2DD4BF">P</tspan></text></g><text x="24.3" y="287.55" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="6.82" font-weight="bold" fill="#fff" text-anchor="start" >WastePlanner</text><text x="24.3" y="291.62" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.52" font-weight="normal" fill="#BFD6D0" text-anchor="start" >by Pro Waste Consultants</text><text x="200" y="285.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.4" font-weight="bold" fill="#fff" text-anchor="end" >Free signage pack: wasteplanner.au/signage</text><text x="200" y="291.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="3.0" font-weight="normal" fill="#BFD6D0" text-anchor="end" >Edit the contact block before printing</text></svg>